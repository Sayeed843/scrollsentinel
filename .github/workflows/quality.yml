name: ScrollSentinel JavaScript QA

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: javascript-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test cybersecurity stories
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check schedule.js
          node --check break-core.js
          node --check break-visual.js
          node --check break.js
          node --check background.js
          node --check popup.js
          node --check options.js
          node --check quest-stories.js
          node --check guard.js
      - name: Run story and manifest tests
        run: node --test tests/*.test.cjs
