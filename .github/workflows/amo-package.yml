name: Build Mozilla Upload ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: amo-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package ScrollSentinel for AMO
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the source
        uses: actions/checkout@v4
      - name: Prepare clean extension ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          FILE="scrollsentinel-v$VERSION-amo.zip"
          zip -q "$FILE" manifest.json schedule.js break-core.js break-visual.js break.js background.js quest-stories.js guard.js popup.html popup.js options.html options.js icons/scrollsentinel.svg icons/scrollsentinel-*.png LICENSE
          test "$(unzip -Z -1 "$FILE" | head -n 1)" = "manifest.json"
          unzip -t "$FILE"
          echo "FILE=$FILE" >> "$GITHUB_ENV"
      - name: Run Mozilla Add-ons linter (reject warnings)
        run: npx --yes addons-linter@latest "$FILE" --warnings-as-errors
      - name: Upload Mozilla submission ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ScrollSentinel-AMO-upload-zip
          path: ${{ env.FILE }}
          if-no-files-found: error
          retention-days: 30
