<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:14px system-ui;width:310px;padding:16px;background:#0d1727;color:#f5f5f5}h2{margin:0;font-size:20px}.brand-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}.brand-head img{border-radius:10px;flex-shrink:0}.brand-subtitle{display:block;color:#90bfd8;font-size:11px;letter-spacing:.3px}label{display:block;margin:12px 0}input[type=time],input[type=number],select{background:#fff;color:#111;border:0;border-radius:6px;padding:7px;max-width:105px}input[type=number]{width:65px}button{padding:12px;width:100%;border:0;border-radius:6px;background:#126eaf;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.row{margin:10px 0}.status{font-weight:700;margin:12px 0}small{color:#bababa}</style></head><body><header class="brand-head"><img src="icons/scrollsentinel.svg" width="44" height="44" alt="ScrollSentinel shield icon"><div><h2>ScrollSentinel</h2><span class="brand-subtitle">YouTube Focus Protection</span></div></header><label><input type="checkbox" id="enabled"> Enable YouTube blocking</label><div id="status" class="status"></div><div id="usage" class="status"></div><div class="row">Window 1: <input type="time" id="s1"> – <input type="time" id="e1"></div><div class="row">Window 2: <input type="time" id="s2"> – <input type="time" id="e2"></div><label>Daily limit: <input type="number" min="1" max="1440" id="dailyLimit"> minutes</label><label><input type="checkbox" id="distractionFree"> Distraction-Free YouTube</label><label>Strict Mode: <select id="lockDays"><option value="0">No lock</option><option value="7">7 days</option><option value="14">14 days</option></select></label><div id="lockStatus" class="status" role="status"></div><button id="save">Save settings</button><p><small>Strict Mode locks the settings inside this add-on. It cannot prevent Firefox from disabling/uninstalling the extension or local data from being erased. Usage is estimated from focused YouTube tabs.</small></p><script src="popup.js"></script></body></html>
