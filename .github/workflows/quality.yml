name: ScrollSentinel JavaScript QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Test cybersecurity stories
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check background.js
          node --check popup.js
          node --check quest-stories.js
          node --check guard.js
      - name: Run story and manifest tests
        run: node --test tests/quest-stories.test.cjs
